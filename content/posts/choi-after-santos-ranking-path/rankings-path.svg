<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">페더급 랭킹 진입 경로 일러스트</title>
  <desc id="desc">랭킹 진입 직전 단계와 다음 경기의 중요성을 상징하는 계단형 에디토리얼 이미지</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#4a5568"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)"/>
  <g fill="url(#step)">
    <rect x="170" y="680" width="230" height="90" rx="10"/>
    <rect x="410" y="590" width="230" height="180" rx="10"/>
    <rect x="650" y="500" width="230" height="270" rx="10"/>
    <rect x="890" y="410" width="230" height="360" rx="10"/>
    <rect x="1130" y="300" width="300" height="470" rx="10"/>
  </g>
  <g fill="#ffffff" font-family="Arial, sans-serif">
    <text x="140" y="145" font-size="46" font-weight="700">Next Fight Decides The Number</text>
    <text x="140" y="194" font-size="26" opacity="0.72">One more credible win turns momentum into a ranking case.</text>
    <text x="230" y="735" font-size="22" opacity="0.75">return</text>
    <text x="455" y="645" font-size="22" opacity="0.75">three finishes</text>
    <text x="688" y="555" font-size="22" opacity="0.75">gatekeeper test</text>
    <text x="948" y="465" font-size="22" opacity="0.75">ranking argument</text>
    <text x="1195" y="355" font-size="28" font-weight="700">Top 15</text>
  </g>
  <path d="M280 640 C410 570 560 540 710 480 C830 430 940 380 1180 320" fill="none" stroke="#ff6b57" stroke-width="12" stroke-linecap="round"/>
  <circle cx="1180" cy="320" r="16" fill="#ff6b57"/>
</svg>
